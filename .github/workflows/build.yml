name: build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "只构建某个 profile（留空=全部）"
        required: false
        type: choice
        options: ["", "h5000m", "7dr7230"]
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 18 * * 0"   # 每周日 18:00 UTC 跑一次，验证仍能贴上游

permissions:
  contents: write

# WARP_VERSION / CHIP 是编译期单值，不同芯片必须分开 job 构建
jobs:
  # job 级 if 拿不到 matrix 上下文，所以先用 prepare 生成 matrix
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          ALL='[
            {"profile":"h5000m","config":"mt7987_h5000m","chip":"mt7987"},
            {"profile":"7dr7230","config":"mt7988_7dr7230","chip":"mt7988"}
          ]'
          SEL="${{ github.event.inputs.profile }}"
          if [ -n "$SEL" ]; then
            M=$(echo "$ALL" | jq -c --arg p "$SEL" '[.[] | select(.profile==$p)]')
          else
            M=$(echo "$ALL" | jq -c .)
          fi
          echo "matrix={\"include\":$M}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      PROFILE: ${{ matrix.profile }}

    steps:
      - uses: actions/checkout@v4

      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget qemu-utils \
            ccache libelf-dev

      # ---- 专有 tarball：从私有 Release / 私有仓库拉取（不随公共仓库分发）----
      # 需要的 secret：VL_REPO（如 owner/higo-vendor-dl）、VL_TOKEN（repo 读权限 PAT）
      - name: 拉取专有 tarball
        env:
          GH_TOKEN: ${{ secrets.VL_TOKEN }}
          VL_REPO: ${{ secrets.VL_REPO }}
        run: |
          mkdir -p dl
          if [ -n "${VL_REPO:-}" ]; then
            gh release download --repo "$VL_REPO" --pattern '*' --dir dl --clobber || true
          fi
          ls -la dl

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.profile }}

      - name: 缓存 dl
        uses: actions/cache@v4
        with:
          path: build/openwrt/dl
          key: dl-${{ matrix.profile }}-${{ hashFiles('dl/SHA256SUMS') }}
          restore-keys: dl-${{ matrix.profile }}-

      - name: 构建
        run: |
          chmod +x scripts/build.sh
          BUILD_ROOT="$PWD/build" DL_DIR="$PWD/dl" JOBS="$(nproc)" \
            scripts/build.sh "$PROFILE"

      - name: 生成校验和
        run: |
          cd build/openwrt/bin/targets/mediatek/filogic/
          sha256sum *sysupgrade* *recovery* 2>/dev/null > sha256sums || true
          cat sha256sums || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: higowrt-${{ matrix.profile }}-${{ github.sha }}
          path: |
            build/openwrt/bin/targets/mediatek/filogic/*sysupgrade*
            build/openwrt/bin/targets/mediatek/filogic/*recovery*
            build/openwrt/bin/targets/mediatek/filogic/sha256sums
          if-no-files-found: error

      - name: 发布 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/openwrt/bin/targets/mediatek/filogic/*sysupgrade*
            build/openwrt/bin/targets/mediatek/filogic/*recovery*
            build/openwrt/bin/targets/mediatek/filogic/sha256sums
