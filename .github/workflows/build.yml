name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 18 * * 0"   # 每周日 18:00 UTC 跑一次，验证仍能贴上游

permissions:
  contents: write

# 本仓库只支持 Hiveton H5000M（MT7987A + MT7992，eMMC）。
# 若以后要加设备：把 jobs.build 改成 strategy.matrix（matrix 变量不能在 job 级 if 里用，
# 需要先加一个 prepare job 生成 matrix），并给每个设备一份 configs/mtXXXX_<profile>.config。
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      PROFILE: h5000m
      # 可用仓库 Variable 覆盖 Wi-Fi SKU（默认取 defconfig 的 BE5040）；
      # 实机验证时设 SKU=BE3600SDB 再手动跑一次做 A/B。
      SKU: ${{ vars.SKU }}

    steps:
      - uses: actions/checkout@v4

      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget qemu-utils \
            ccache libelf-dev

      # ---- 专有 tarball：从私有 Release / 私有仓库拉取（不随公共仓库分发）----
      # 需要的 secret：VL_REPO（如 owner/higo-vendor-dl）、VL_TOKEN（repo 读权限 PAT）
      - name: 拉取专有 tarball
        env:
          GH_TOKEN: ${{ secrets.VL_TOKEN }}
          VL_REPO: ${{ secrets.VL_REPO }}
        run: |
          mkdir -p dl
          if [ -n "${VL_REPO:-}" ]; then
            gh release download --repo "$VL_REPO" --pattern '*' --dir dl --clobber || true
          fi
          ls -la dl

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ env.PROFILE }}

      - name: 缓存 dl
        uses: actions/cache@v4
        with:
          path: build/openwrt/dl
          key: dl-${{ env.PROFILE }}-${{ hashFiles('dl/SHA256SUMS') }}
          restore-keys: dl-${{ env.PROFILE }}-

      - name: 构建
        run: |
          chmod +x scripts/build.sh
          BUILD_ROOT="$PWD/build" DL_DIR="$PWD/dl" JOBS="$(nproc)" \
            scripts/build.sh "$PROFILE"

      - name: 生成校验和
        run: |
          cd build/openwrt/bin/targets/mediatek/filogic/
          sha256sum *sysupgrade* *recovery* 2>/dev/null > sha256sums || true
          cat sha256sums || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: higowrt-${{ env.PROFILE }}-${{ github.sha }}
          path: |
            build/openwrt/bin/targets/mediatek/filogic/*sysupgrade*
            build/openwrt/bin/targets/mediatek/filogic/*recovery*
            build/openwrt/bin/targets/mediatek/filogic/sha256sums
          if-no-files-found: error

      - name: 发布 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/openwrt/bin/targets/mediatek/filogic/*sysupgrade*
            build/openwrt/bin/targets/mediatek/filogic/*recovery*
            build/openwrt/bin/targets/mediatek/filogic/sha256sums
